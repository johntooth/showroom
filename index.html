<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Showroom</title>
    <script>
      // Apply the saved theme before first paint so light-theme users don't see a dark flash.
      try {
        var theme = JSON.parse(localStorage.getItem("showroom.theme"))
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
